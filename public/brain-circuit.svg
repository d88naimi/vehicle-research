<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 110" fill="none" stroke="#0F172A" stroke-linecap="round" stroke-linejoin="round">

  <!-- CENTER TRUNK -->
  <line x1="60" y1="8" x2="60" y2="102" stroke-width="4.5"/>

  <!-- ══ CIRCUIT RIGHT SIDE ══ -->

  <!-- Branch 1 (top): right → step down → circle -->
  <polyline points="60,18 82,18 82,24" stroke-width="4"/>
  <line x1="82" y1="24" x2="94" y2="24" stroke-width="4"/>
  <circle cx="101" cy="24" r="7" stroke-width="4"/>

  <!-- Branch 2: straight right → circle -->
  <line x1="60" y1="40" x2="94" y2="40" stroke-width="4"/>
  <circle cx="101" cy="40" r="7" stroke-width="4"/>

  <!-- Branch 3: right → step down → right → circle -->
  <polyline points="60,54 76,54 76,62 94,62" stroke-width="4"/>
  <circle cx="101" cy="62" r="7" stroke-width="4"/>

  <!-- Branch 4: straight right → circle -->
  <line x1="60" y1="76" x2="94" y2="76" stroke-width="4"/>
  <circle cx="101" cy="76" r="7" stroke-width="4"/>

  <!-- Branch 5 (bottom): right → step down → circle -->
  <polyline points="60,88 76,88 76,96 94,96" stroke-width="4"/>
  <circle cx="101" cy="96" r="7" stroke-width="4"/>

  <!-- ══ BRAIN LEFT SIDE ══ -->
  <!-- Outer brain silhouette (bumpy lobes) -->
  <path d="
    M60,10
    Q54,6  46,9
    Q38,8  33,15
    Q26,14 22,22
    Q16,26 18,34
    Q13,38 14,45
    Q10,50 13,56
    Q10,62 14,68
    Q14,75 19,80
    Q22,87 30,90
    Q36,96 44,97
    Q51,99 60,97
  " stroke-width="4.5"/>

  <!-- Internal brain fold lines (gyri) -->

  <!-- Top gyrus -->
  <path d="M46,10 Q40,16 43,22 Q46,26 52,24" stroke-width="3.5"/>

  <!-- Upper-left gyrus -->
  <path d="M26,20 Q20,26 23,32 Q27,38 34,36 Q40,34 40,28" stroke-width="3.5"/>

  <!-- Mid-upper gyrus -->
  <path d="M16,38 Q18,32 24,34 Q30,36 30,42 Q30,48 24,50 Q18,50 16,46" stroke-width="3.5"/>

  <!-- Inner mid fold -->
  <path d="M32,40 Q38,38 40,44 Q42,50 36,52 Q30,54 28,50" stroke-width="3"/>

  <!-- Center fold -->
  <path d="M42,28 Q48,32 46,40 Q44,46 48,50 Q52,54 50,58" stroke-width="3"/>

  <!-- Mid-lower gyrus -->
  <path d="M14,54 Q18,58 22,56 Q28,54 30,60 Q30,66 24,68 Q18,68 15,64" stroke-width="3.5"/>

  <!-- Lower fold -->
  <path d="M28,64 Q34,62 38,68 Q40,74 34,76 Q28,78 25,74" stroke-width="3"/>

  <!-- Bottom gyrus -->
  <path d="M20,78 Q24,84 30,86 Q38,90 44,86 Q50,82 50,76" stroke-width="3.5"/>

  <!-- Small inner curls -->
  <path d="M36,52 Q42,56 40,62 Q38,68 32,68" stroke-width="2.8"/>
  <path d="M44,62 Q50,66 48,74 Q46,80 40,80" stroke-width="2.8"/>

</svg>
